
name: GITHUB CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-frontend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./client
      steps:
        - uses: actions/checkout@v5

        - name: Set up Node.js
          uses: actions/setup-node@v6
          with:
            cache: 'npm'     
            node-version: '24'  
            cache-dependency-path: ./client/package-lock.json 

        - name: Install dependencies
          run: npm ci          

        - name: Build frontend
          run: npm run build

  build-backend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./server
      steps:
        - uses: actions/checkout@v5

        - name: Set up Node.js
          uses: actions/setup-node@v6
          with:
            cache: 'npm'     
            node-version: '24'  
            cache-dependency-path: ./server/package-lock.json 

        - name: Install dependencies
          run: npm ci          

        - name: Build backend
          run: npm run build