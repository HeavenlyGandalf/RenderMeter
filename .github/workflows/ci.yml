
name: GITHUB CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  GITHUB_OWNER_RAW: ${{ github.repository_owner }}
  GITHUB_REPO_RAW: ${{ github.event.repository.name }}
jobs:
  build-frontend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./client
      steps:
        - uses: actions/checkout@v5

        - name: Set up Node.js
          uses: actions/setup-node@v6
          with:
            cache: 'npm'     
            node-version: '24'  
            cache-dependency-path: ./client/package-lock.json 

        - name: Install dependencies
          run: npm ci          

        - name: Build frontend
          run: npm run build

  build-backend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./server
      steps:
        - uses: actions/checkout@v5

        - name: Set up Node.js
          uses: actions/setup-node@v6
          with:
            cache: 'npm'     
            node-version: '24'  
            cache-dependency-path: ./server/package-lock.json 

        - name: Install dependencies
          run: npm ci          

        - name: Build backend
          run: npm run build

  build-push-frontend:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./client
    permissions:
      contents: read
      packages: write 
    needs: [build-frontend] 
    steps:
      - uses: actions/checkout@v4
      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/render-meter-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/render-meter-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  build-push-backend:
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./server
    permissions:
      contents: read
      packages: write 
    needs: [build-backend] 
    steps:
      - uses: actions/checkout@v4
      - name: Normalize names to lowercase
        run: |
          echo "OWNER_LOWER=$(echo "$GITHUB_OWNER_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "$GITHUB_REPO_RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/render-meter-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}/render-meter-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max